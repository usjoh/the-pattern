<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pattern has moved</title>
  <link rel="canonical" href="https://usjoh.github.io/writing/the-pattern/">
  <meta name="robots" content="noindex">
  <!-- This address is the essay's original March 2026 location. It now forwards
       to the current version. Each arrival here is counted under its own name
       ("/old-link/the-pattern") so the author can see whether this old address
       is still being followed, and from where. -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://usjoh.github.io/writing/the-pattern/">
  </noscript>
  <style>
    body { font: 17px/1.5 Georgia, serif; color: #222; max-width: 34em; margin: 18vh auto; padding: 0 1.2em; }
    a { color: #1a4f8b; }
  </style>
</head>
<body>
  <p><strong>The Pattern</strong> has moved.</p>
  <p>Taking you to the current version:
    <a href="https://usjoh.github.io/writing/the-pattern/">usjoh.github.io/writing/the-pattern/</a></p>

  <noscript>
    <img src="https://usjoh.goatcounter.com/count?p=%2Fold-link%2Fthe-pattern&amp;t=Old%20link%3A%20The%20Pattern%20(redirected)" alt="" width="1" height="1">
  </noscript>

  <script>
    (function () {
      var dest = 'https://usjoh.github.io/writing/the-pattern/';
      var gone = false;
      function go() { if (!gone) { gone = true; location.replace(dest); } }

      // Same fields the site's visit counter sends, under a path of its own.
      var enc = encodeURIComponent;
      var url = 'https://usjoh.goatcounter.com/count'
        + '?p=' + enc('/old-link/the-pattern')
        + '&t=' + enc('Old link: The Pattern (redirected)')
        + (document.referrer ? '&r=' + enc(document.referrer) : '')
        + '&s=' + (window.screen ? screen.width : 0)
        + '&b=' + (navigator.webdriver ? 153 : 0)
        + (location.search ? '&q=' + enc(location.search) : '')
        + '&rnd=' + Math.random().toString(36).substr(2, 5);

      var sent = false;
      try { sent = !!(navigator.sendBeacon && navigator.sendBeacon(url)); } catch (e) {}
      if (sent) { go(); return; }

      // Fallback: wait briefly for an image request, then go either way.
      var img = new Image();
      img.onload = go; img.onerror = go;
      img.src = url;
      setTimeout(go, 1500);
    })();
  </script>
</body>
</html>
